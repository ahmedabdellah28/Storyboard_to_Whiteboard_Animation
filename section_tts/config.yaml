tts:
  provider: gemini
  model: gemini-3.1-flash-tts-preview
  voice: Fenrir
  sample_rate: 24000
  temperature: 2.0

voice_profile:
  name: "Saudi Male Youth - Fast YouTube Explainer"
  voice_name: "Fenrir"
  gender: "male"
  dialect: "Saudi Arabic (Neutral / White)"
  target_wpm: 168.0
  system_directive: |
    # Audio Profile
    Young Saudi male YouTube creator, around 25–30 years old. Natural modern Saudi Arabic accent, clearly Saudi but easy to understand across the Arab world. Medium male pitch, youthful, energetic, confident and expressive. Conversational and charismatic, with a natural vocal smile. He sounds spontaneous and authentic, never like a news anchor, documentary narrator, audiobook reader, or commercial announcer.

    # Scene
    A fast-paced animated YouTube explainer for a young Arabic-speaking audience. Rapid stickman-style visuals, frequent visual changes, quick jokes, surprising facts and constant forward motion.

    The narrator is speaking directly to the viewer in an energetic, natural and conversational way, as if explaining something fascinating to a friend.

    The scene is youthful, clever, entertaining and highly engaging. The narration should feel tightly synchronized with fast animation and should almost never stop.

    # Sample Context
    This is a fast Saudi YouTube explainer, not a documentary.

    The speaker talks continuously at a very fast conversational pace with a natural bouncing cadence. Words and phrases flow smoothly into each other. Use extremely short micro-pauses only for natural breathing or brief emphasis.

    Keep the speech moving forward at all times. No dead air. No long pauses. No dramatic silence.

    The energy comes from rhythm, pitch variation, emphasis and conversational excitement rather than shouting.

    The Saudi accent should sound natural, modern and authentic, not exaggerated.

    The speaker sounds like he is spontaneously telling the viewer something fascinating and cannot wait to get to the next point.

chunking:
  max_words_per_chunk: 28
  min_words_per_chunk: 6
  respect_punctuation: true
  respect_paragraphs: true

stitching:
  pause_between_chunks_ms: 80
  micro_crossfade_ms: 8

loudness:
  enabled: true
  target_rms: 0.15
  max_peak: 0.95

post_processing:
  speed_adjustment:
    enabled: false
    min: 0.98
    max: 1.08

validation:
  min_duration_per_chunk_sec: 0.8
  min_wpm: 110.0
  max_wpm: 230.0
  max_silence_ratio: 0.35
  max_peak_allowed: 1.0

retry:
  max_retries: 3
  initial_delay_sec: 1.5
  backoff_multiplier: 2.0
  jitter: true
